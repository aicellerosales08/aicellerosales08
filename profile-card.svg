<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="640" height="240" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="640" height="240" fill="url(#cardBg)"/>

    <!-- title bar -->
    <rect x="0" y="0" width="640" height="34" fill="#FF9EBB"/>
    <circle cx="20" cy="17" r="6" fill="#FF6F91"/>
    <circle cx="40" cy="17" r="6" fill="#FFD166"/>
    <circle cx="60" cy="17" r="6" fill="#B5E6C9"/>
    <text x="320" y="22" text-anchor="middle" font-family="monospace" font-size="13" fill="#8B2E4F" font-weight="bold">profile.yaml</text>

    <!-- floating soft hearts in background -->
    <g fill="#FF9EBB" opacity="0.25">
      <path d="M560,60 c-3,-6 -12,-3 -12,3 c0,5 12,12 12,12 c0,0 12,-7 12,-12 c0,-6 -9,-9 -12,-3 Z">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,-60" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.15;0" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M40,180 c-2,-4 -8,-2 -8,2 c0,3 8,8 8,8 c0,0 8,-5 8,-8 c0,-4 -6,-6 -8,-2 Z">
        <animateTransform attributeName="transform" type="translate" values="0,0; 20,-25; 40,-50" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.15;0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- code lines -->
    <g font-family="monospace" font-size="15">
      <text x="24" y="66"><tspan fill="#B23A62" font-weight="bold">Name:</tspan><tspan fill="#8B2E4F"> Aicelle Rosales</tspan></text>
      <text x="24" y="96"><tspan fill="#B23A62" font-weight="bold">Role:</tspan><tspan fill="#8B2E4F"> Web Designer • Developer • UI/UX Designer</tspan></text>
      <text x="24" y="126"><tspan fill="#B23A62" font-weight="bold">Location:</tspan><tspan fill="#8B2E4F"> Philippines 🇵🇭</tspan></text>
      <text x="24" y="156"><tspan fill="#B23A62" font-weight="bold">Currently Working:</tspan><tspan fill="#8B2E4F"> Web Designer — Wix Website Projects</tspan></text>
      <text x="24" y="186"><tspan fill="#B23A62" font-weight="bold">Currently Learning:</tspan><tspan fill="#8B2E4F"> Back-End • Full-Stack Development</tspan></text>
      <text x="24" y="216">
        <tspan fill="#B23A62" font-weight="bold">Fun Fact:</tspan><tspan fill="#8B2E4F"> I turn coffee ☕ and Figma frames into magic ✧</tspan>
      </text>
    </g>

    <!-- blinking cursor at the end -->
    <rect x="565" y="203" width="9" height="16" fill="#B23A62">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
    </rect>

  </g>

  <rect x="1" y="1" width="638" height="238" rx="16" fill="none" stroke="#FF6F91" stroke-width="2"/>
</svg>
