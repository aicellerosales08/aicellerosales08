<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFD1DC"/>
      <stop offset="80%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="70" width="900" height="2" fill="url(#barGrad10)"/>

  <!-- desk -->
  <rect x="380" y="72" width="140" height="6" rx="2" fill="#E8A0B8"/>

  <!-- character sitting, typing -->
  <g transform="translate(450,72)">
    <circle cx="0" cy="-22" r="9" fill="#FFDDE6"/>
    <path d="M-9,-24 Q0,-38 9,-24" fill="#B23A62"/>
    <circle cx="-3" cy="-23" r="1.3" fill="#3A2A2E"/>
    <circle cx="3" cy="-23" r="1.3" fill="#3A2A2E"/>
    <path d="M-2,-18 Q0,-16 2,-18" stroke="#B23A62" stroke-width="1" fill="none"/>
    <rect x="-9" y="-13" width="18" height="16" rx="5" fill="#FF9EBB"/>
    <!-- laptop -->
    <rect x="-14" y="-4" width="28" height="4" rx="1" fill="#8B2E4F"/>
    <rect x="-13" y="-14" width="26" height="10" rx="1.5" fill="#FFF0F5" stroke="#8B2E4F" stroke-width="1.5"/>
    <g font-family="monospace" font-size="4.5" fill="#B23A62">
      <text x="-11" y="-9">
        &lt;/&gt; ✧
        <animate attributeName="opacity" values="1;0.3;1" dur="1.3s" repeatCount="indefinite"/>
      </text>
      <text x="-11" y="-5">
        design.css
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- typing hands -->
    <line x1="-6" y1="-2" x2="-8" y2="0" stroke="#FFDDE6" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="y2" values="0;-1.5;0" dur="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="6" y1="-2" x2="8" y2="0" stroke="#FFDDE6" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="y2" values="0;-1.5;0" dur="0.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- coffee cup with steam -->
  <g transform="translate(370,68)">
    <path d="M-6,0 L6,0 L5,8 Q0,10 -5,8 Z" fill="#FFF0F5" stroke="#8B4F3A" stroke-width="1.2"/>
    <path d="M6,1 Q11,1 10,5 Q9,8 6,7" fill="none" stroke="#8B4F3A" stroke-width="1.2"/>
    <g stroke="#E8CBD5" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M-2,-2 Q-4,-8 -1,-12">
        <animate attributeName="d" values="M-2,-2 Q-4,-8 -1,-12; M-2,-2 Q0,-8 -3,-12; M-2,-2 Q-4,-8 -1,-12" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M2,-2 Q0,-8 3,-12">
        <animate attributeName="d" values="M2,-2 Q0,-8 3,-12; M2,-2 Q4,-8 1,-12; M2,-2 Q0,-8 3,-12" dur="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- floating figma-color frame drifting -->
  <g transform="translate(230,45)">
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#FFF0F5" stroke="#8E75FF" stroke-width="1.5"/>
    <circle cx="-3" cy="-3" r="2.5" fill="#FF6F91"/>
    <rect x="1" y="-4" width="6" height="3" fill="#FFD166"/>
    <rect x="-6" y="2" width="12" height="3" fill="#B5E6C9"/>
    <animateTransform attributeName="transform" type="translate" values="230,45; 230,35; 230,45" dur="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 230 45; 8 230 45; 0 230 45; -8 230 45; 0 230 45" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- floating heart -->
  <g fill="#FF6F91">
    <path d="M650,50 c-2,-4 -8,-2 -8,2 c0,3 8,8 8,8 c0,0 8,-5 8,-8 c0,-4 -6,-6 -8,-2 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-22; 0,-44" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- twinkles -->
  <g fill="#FFD166">
    <path d="M150,30 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M750,25 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M810,55 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- mushroom buddy -->
  <g transform="translate(90,60)">
    <ellipse cx="0" cy="6" rx="8" ry="4" fill="#FFDCE8"/>
    <path d="M-8,0 Q0,-14 8,0 Z" fill="#FF9EBB"/>
    <circle cx="-3" cy="-5" r="1.4" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="90,60; 90,53; 90,60" dur="1.2s" repeatCount="indefinite"/>
  </g>
</svg>
