<svg viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad9" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFD1DC"/>
      <stop offset="80%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="55" width="900" height="2" fill="url(#barGrad9)"/>

  <!-- screen with wireframe drawing itself, center -->
  <g transform="translate(450,52)">
    <rect x="-26" y="-20" width="52" height="36" rx="3" fill="#FFF0F5" stroke="#B23A62" stroke-width="2"/>
    <rect x="-22" y="-16" width="44" height="8" rx="1.5" fill="#FFD1DC">
      <animate attributeName="width" values="0;44;44;0" keyTimes="0;0.3;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="-22" y="-5" width="18" height="16" rx="1.5" fill="#B5E6C9">
      <animate attributeName="height" values="0;16;16;0" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="-5" width="20" height="7" rx="1.5" fill="#FFD166">
      <animate attributeName="width" values="0;20;20;0" keyTimes="0;0.5;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="4" width="20" height="7" rx="1.5" fill="#8E75FF" opacity="0.8">
      <animate attributeName="width" values="0;20;20;0" keyTimes="0;0.6;0.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <path d="M-26,16 L26,16 L32,22 L-32,22 Z" fill="#FF9EBB"/>
    <animateTransform attributeName="transform" type="translate" values="450,52; 450,46; 450,52" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- clicking cursor -->
  <g>
    <path d="M0,0 L0,14 L4,10.5 L6.5,15.5 L8.5,14.5 L6,9.5 L11,9.5 Z" fill="#B23A62">
      <animateTransform attributeName="transform" type="translate" values="520,60; 520,60; 490,50; 490,50; 520,60" keyTimes="0;0.3;0.5;0.8;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="490" cy="50" r="0" fill="#FF9EBB" opacity="0.5">
      <animate attributeName="r" values="0;10;0" keyTimes="0;0.05;1" begin="1.5s" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0" keyTimes="0;0.1;1" begin="1.5s" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- color palette drifting left -->
  <g transform="translate(280,50)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#FFE3C2"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#FF6F91"/>
    <circle cx="2" cy="-6" r="2.5" fill="#FFD166"/>
    <circle cx="7" cy="0" r="2.5" fill="#8E75FF"/>
    <circle cx="-3" cy="4" r="2.5" fill="#B5E6C9"/>
    <animateTransform attributeName="transform" type="translate" values="280,50; 280,42; 280,50" dur="2.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 280 50; 8 280 50; 0 280 50; -8 280 50; 0 280 50" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- ruler / grid icon drifting right -->
  <g transform="translate(650,45)">
    <rect x="-16" y="-4" width="32" height="8" rx="1.5" fill="#B5E6C9" stroke="#5A8F6E" stroke-width="1"/>
    <line x1="-10" y1="-4" x2="-10" y2="0" stroke="#5A8F6E" stroke-width="1"/>
    <line x1="-2" y1="-4" x2="-2" y2="0" stroke="#5A8F6E" stroke-width="1"/>
    <line x1="6" y1="-4" x2="6" y2="0" stroke="#5A8F6E" stroke-width="1"/>
    <animateTransform attributeName="transform" type="translate" values="650,45; 650,38; 650,45" dur="2.9s" repeatCount="indefinite"/>
  </g>

  <!-- twinkles -->
  <g fill="#FFD166">
    <path d="M170,25 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M760,30 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M820,60 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- mushroom cheering at edges -->
  <g transform="translate(100,55)">
    <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="#FFDCE8"/>
    <path d="M-7,0 Q0,-12 7,0 Z" fill="#FF6F91"/>
    <circle cx="-2.5" cy="-4" r="1.2" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="100,55; 100,49; 100,55" dur="1.1s" repeatCount="indefinite"/>
  </g>
</svg>
