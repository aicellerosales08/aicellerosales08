<svg viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFD1DC"/>
      <stop offset="80%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="44" width="900" height="2" fill="url(#barGrad3)"/>

  <!-- spinning gear left of center -->
  <g transform="translate(400,45)">
    <g>
      <path d="M0,-16 L4,-16 L5,-10 L9,-8 L14,-11 L17,-8 L14,-3 L16,1 L22,1 L22,5 L16,6 L14,11 L17,15 L14,18 L9,14 L5,17 L4,22 L0,22 L-1,17 L-6,14 L-10,18 L-13,15 L-10,11 L-12,6 L-18,5 L-18,1 L-12,1 L-10,-3 L-13,-8 L-10,-11 L-6,-8 L-1,-10 Z" 
            fill="#FF9EBB" opacity="0.85"/>
      <circle r="7" fill="#FFF0F5"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 45" to="360 400 45" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- paintbrush painting a little stroke -->
  <g transform="translate(500,45)">
    <path d="M-15,5 Q0,-5 15,5" stroke="#FFD166" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,60; 60,60" dur="2s" repeatCount="indefinite"/>
    </path>
    <g>
      <rect x="-3" y="-14" width="6" height="14" rx="2" fill="#8B4F3A"/>
      <polygon points="-4,-14 4,-14 2,-20 -2,-20" fill="#B23A62"/>
      <animateTransform attributeName="transform" type="translate" values="-15,-4; 15,-4; -15,-4" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating code brackets -->
  <g font-family="monospace" font-weight="bold" font-size="20" fill="#8B2E4F" opacity="0.75">
    <text x="160" y="52">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="55">
      { }
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="2.7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- twinkling sparkles -->
  <g fill="#FFD166">
    <path d="M240,25 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M640,65 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- mushroom hopping at the edge -->
  <g transform="translate(90,55)">
    <ellipse cx="0" cy="6" rx="8" ry="4" fill="#FFDCE8"/>
    <path d="M-8,0 Q0,-14 8,0 Z" fill="#FF6F91"/>
    <circle cx="-3" cy="-5" r="1.4" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="90,55; 90,48; 90,55" dur="1.1s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(820,50)">
    <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="#FFDCE8"/>
    <path d="M-7,0 Q0,-12 7,0 Z" fill="#B5E6C9"/>
    <circle cx="-2.5" cy="-4" r="1.2" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="820,50; 820,44; 820,50" dur="1.3s" repeatCount="indefinite"/>
  </g>
</svg>
