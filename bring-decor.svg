<svg viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFE29A"/>
      <stop offset="80%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="44" width="900" height="2" fill="url(#barGrad5)"/>

  <!-- glowing lightbulb, center -->
  <g transform="translate(450,42)">
    <g>
      <circle r="14" fill="#FFE29A">
        <animate attributeName="r" values="13;16;13" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="#FFD166"/>
      <path d="M-4,10 L4,10 L3,15 L-3,15 Z" fill="#B23A62"/>
      <line x1="-3" y1="12" x2="3" y2="12" stroke="#8B2E4F" stroke-width="1"/>
      <!-- radiating light rays -->
      <g stroke="#FFD166" stroke-width="2" stroke-linecap="round" opacity="0.8">
        <line x1="0" y1="-20" x2="0" y2="-26">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="14" y1="-14" x2="19" y2="-19">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="-14" y1="-14" x2="-19" y2="-19">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
  </g>

  <!-- floating hearts -->
  <g fill="#FF6F91">
    <path d="M300,50 c-2,-4 -8,-2 -8,2 c0,3 8,8 8,8 c0,0 8,-5 8,-8 c0,-4 -6,-6 -8,-2 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-20; 0,-40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M600,55 c-1.5,-3 -6,-1.5 -6,1.5 c0,2.5 6,6 6,6 c0,0 6,-3.5 6,-6 c0,-3 -4.5,-4.5 -6,-1.5 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 8,-18; 16,-36" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- rocket zooming for "passion for building" -->
  <g transform="translate(180,50)">
    <g transform="rotate(-45)">
      <ellipse cx="0" cy="0" rx="5" ry="12" fill="#FFF0F5" stroke="#B23A62" stroke-width="1.2"/>
      <polygon points="-5,-8 5,-8 0,-16" fill="#FF6F91"/>
      <polygon points="-5,6 -9,12 -5,10" fill="#FF9EBB"/>
      <polygon points="5,6 9,12 5,10" fill="#FF9EBB"/>
      <circle cx="0" cy="-1" r="2.5" fill="#8E75FF"/>
      <path d="M-2,10 Q0,18 2,10" fill="#FFD166" opacity="0.8">
        <animate attributeName="d" values="M-2,10 Q0,18 2,10; M-2,10 Q0,24 2,10; M-2,10 Q0,18 2,10" dur="0.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <animateTransform attributeName="transform" type="translate" values="180,50; 220,10; 260,-30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- twinkles -->
  <g fill="#FFD166">
    <path d="M720,60 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M780,25 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
