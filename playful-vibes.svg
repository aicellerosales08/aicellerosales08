<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB"/>
      <stop offset="50%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC2D6"/>
      <stop offset="100%" stop-color="#FFB0CB"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="260" rx="20" fill="url(#sky)"/>

  <!-- floating clouds -->
  <g opacity="0.85">
    <g>
      <ellipse cx="120" cy="45" rx="34" ry="14" fill="#FFF5F8"/>
      <ellipse cx="150" cy="40" rx="26" ry="12" fill="#FFF5F8"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,0; 0,0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="650" cy="35" rx="30" ry="12" fill="#FFF5F8"/>
      <ellipse cx="680" cy="30" rx="22" ry="10" fill="#FFF5F8"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; -35,0; 0,0" dur="16s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- sun -->
  <circle cx="820" cy="45" r="22" fill="#FFE29A">
    <animate attributeName="r" values="22;25;22" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ground -->
  <path d="M0,190 Q450,150 900,190 L900,260 L0,260 Z" fill="url(#ground)"/>

  <!-- little flowers on ground -->
  <g>
    <g transform="translate(60,205)">
      <circle r="4" fill="#fff" cx="-4"/><circle r="4" fill="#fff" cx="4"/><circle r="4" fill="#fff" cy="-4"/><circle r="4" fill="#fff" cy="4"/>
      <circle r="3" fill="#FFD166"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0;10;0;-10;0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(780,215)">
      <circle r="4" fill="#fff" cx="-4"/><circle r="4" fill="#fff" cx="4"/><circle r="4" fill="#fff" cy="-4"/><circle r="4" fill="#fff" cy="4"/>
      <circle r="3" fill="#FFD166"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0;-10;0;10;0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(430,225)">
      <circle r="3.5" fill="#fff" cx="-3.5"/><circle r="3.5" fill="#fff" cx="3.5"/><circle r="3.5" fill="#fff" cy="-3.5"/><circle r="3.5" fill="#fff" cy="3.5"/>
      <circle r="2.5" fill="#FFD166"/>
    </g>
  </g>

  <!-- kite string + kite flying -->
  <g>
    <path d="M300,60 Q330,90 300,140" stroke="#B23A62" stroke-width="1.5" fill="none" opacity="0.6">
      <animate attributeName="d" values="M300,60 Q330,90 300,140; M300,60 Q270,90 300,140; M300,60 Q330,90 300,140" dur="3s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(300,60)">
      <polygon points="0,-14 14,0 0,14 -14,0" fill="#FF8FAB" stroke="#B23A62" stroke-width="1.5"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#B23A62" stroke-width="1"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#B23A62" stroke-width="1"/>
      <animateTransform attributeName="transform" type="translate" values="300,60; 330,45; 300,60; 270,50; 300,60" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- mushroom friend hopping -->
  <g>
    <g transform="translate(190,180)">
      <ellipse cx="0" cy="10" rx="12" ry="6" fill="#FFDCE8"/>
      <path d="M-12,0 Q0,-22 12,0 Z" fill="#FF6F91"/>
      <circle cx="-5" cy="-8" r="2.2" fill="#fff"/>
      <circle cx="4" cy="-12" r="1.6" fill="#fff"/>
      <circle cx="0" cy="-4" r="1.8" fill="#fff"/>
      <circle cx="-4" cy="4" r="1.4" fill="#3A2A2E"/>
      <circle cx="4" cy="4" r="1.4" fill="#3A2A2E"/>
      <path d="M-3,7 Q0,9 3,7" stroke="#3A2A2E" stroke-width="1" fill="none"/>
      <animateTransform attributeName="transform" type="translate" values="190,180; 190,168; 190,180" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- character 1: jumping rope -->
  <g transform="translate(500,175)">
    <ellipse cx="0" cy="42" rx="16" ry="5" fill="#c9789a" opacity="0.4"/>
    <g>
      <!-- rope -->
      <path d="M-22,10 Q0,-32 22,10" stroke="#B23A62" stroke-width="2.5" fill="none">
        <animate attributeName="d" values="M-22,10 Q0,-32 22,10; M-22,10 Q0,40 22,10; M-22,10 Q0,-32 22,10" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <!-- body -->
      <g>
        <circle cx="0" cy="-8" r="9" fill="#FFDDE6"/>
        <path d="M-9,-6 Q0,-20 9,-6" fill="#B23A62"/>
        <circle cx="-3" cy="-9" r="1.3" fill="#3A2A2E"/>
        <circle cx="3" cy="-9" r="1.3" fill="#3A2A2E"/>
        <path d="M-2,-4 Q0,-2 2,-4" stroke="#B23A62" stroke-width="1" fill="none"/>
        <rect x="-6" y="0" width="12" height="16" rx="5" fill="#FF9EBB"/>
        <line x1="-6" y1="16" x2="-8" y2="28" stroke="#8B2E4F" stroke-width="3" stroke-linecap="round"/>
        <line x1="6" y1="16" x2="8" y2="28" stroke="#8B2E4F" stroke-width="3" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0; 0,0" dur="0.9s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- character 2: waving happily -->
  <g transform="translate(600,178)">
    <ellipse cx="0" cy="38" rx="15" ry="5" fill="#c9789a" opacity="0.4"/>
    <circle cx="0" cy="-6" r="9" fill="#FFE3C2"/>
    <path d="M-9,-8 Q0,-22 9,-8" fill="#8B4F3A"/>
    <circle cx="-3" cy="-7" r="1.3" fill="#3A2A2E"/>
    <circle cx="3" cy="-7" r="1.3" fill="#3A2A2E"/>
    <path d="M-2,-2 Q0,0 2,-2" stroke="#B23A62" stroke-width="1" fill="none"/>
    <rect x="-6" y="2" width="12" height="16" rx="5" fill="#B5E6C9"/>
    <line x1="-6" y1="18" x2="-8" y2="30" stroke="#5A8F6E" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="18" x2="8" y2="30" stroke="#5A8F6E" stroke-width="3" stroke-linecap="round"/>
    <g>
      <line x1="6" y1="4" x2="16" y2="-8" stroke="#FFE3C2" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 6 4; 20 6 4; 0 6 4; 20 6 4; 0 6 4" dur="1.2s" repeatCount="indefinite"/>
      </line>
    </g>
    <line x1="-6" y1="4" x2="-14" y2="14" stroke="#FFE3C2" stroke-width="3" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="600,178; 600,174; 600,178" dur="1.3s" repeatCount="indefinite"/>
  </g>

  <!-- character 3: little dog running -->
  <g transform="translate(720,205)">
    <ellipse cx="0" cy="10" rx="13" ry="7" fill="#FFF0F5" stroke="#E8A0B8" stroke-width="1"/>
    <circle cx="12" cy="2" r="6" fill="#FFF0F5" stroke="#E8A0B8" stroke-width="1"/>
    <polygon points="9,-3 6,-9 12,-6" fill="#E8A0B8"/>
    <circle cx="14" cy="1" r="1" fill="#3A2A2E"/>
    <path d="M-13,10 L-15,16 M-6,12 L-7,17 M6,12 L7,17 M12,9 L14,15" stroke="#E8A0B8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="d" 
        values="M-13,10 L-15,16 M-6,12 L-7,17 M6,12 L7,17 M12,9 L14,15;
                 M-13,10 L-11,15 M-6,12 L-9,17 M6,12 L9,17 M12,9 L10,15;
                 M-13,10 L-15,16 M-6,12 L-7,17 M6,12 L7,17 M12,9 L14,15"
        dur="0.5s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="translate" values="640,205; 760,205; 640,205" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- floating hearts / sparkles for good vibes -->
  <g fill="#FF6F91" opacity="0.85">
    <path d="M400,120 c-3,-6 -12,-3 -12,3 c0,5 12,12 12,12 c0,0 12,-7 12,-12 c0,-6 -9,-9 -12,-3 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-30; 0,-60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.6;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M550,130 c-2,-4 -8,-2 -8,2 c0,3 8,8 8,8 c0,0 8,-5 8,-8 c0,-4 -6,-6 -8,-2 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-25; 20,-50" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.5;0" dur="3.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#FFD166">
    <path d="M250,100 l2,5 5,1 -4,3 1,5 -4,-3 -4,3 1,-5 -4,-3 5,-1 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 250 100; 360 250 100" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M680,110 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 680 110; -360 680 110" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- caption -->
  <text x="450" y="245" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" fill="#8B2E4F" font-weight="600">
    good vibes only ✿ let's play, let's create ✿
  </text>
</svg>
