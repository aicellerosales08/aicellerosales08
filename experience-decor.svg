<svg viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="10%" stop-color="#FFD1DC"/>
      <stop offset="90%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- winding path -->
  <path d="M40,70 Q150,30 260,60 T480,55 T700,65 T860,45" stroke="url(#barGrad7)" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2,10"/>

  <!-- milestone flags along the path -->
  <g>
    <g transform="translate(120,45)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#B23A62" stroke-width="1.5"/>
      <path d="M0,0 L10,4 L0,8 Z" fill="#FF6F91"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(340,42)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#B23A62" stroke-width="1.5"/>
      <path d="M0,0 L10,4 L0,8 Z" fill="#FFD166"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(560,40)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#B23A62" stroke-width="1.5"/>
      <path d="M0,0 L10,4 L0,8 Z" fill="#B5E6C9"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(770,32)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#B23A62" stroke-width="1.5"/>
      <path d="M0,0 L11,5 L0,9 Z" fill="#8E75FF"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- small blooming flowers at each stop -->
  <g>
    <g transform="translate(120,68)">
      <circle r="3.5" fill="#fff" cx="-3.5"/><circle r="3.5" fill="#fff" cx="3.5"/><circle r="3.5" fill="#fff" cy="-3.5"/><circle r="3.5" fill="#fff" cy="3.5"/>
      <circle r="2.5" fill="#FFD166"/>
      <animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(560,67)">
      <circle r="3.5" fill="#fff" cx="-3.5"/><circle r="3.5" fill="#fff" cx="3.5"/><circle r="3.5" fill="#fff" cy="-3.5"/><circle r="3.5" fill="#fff" cy="3.5"/>
      <circle r="2.5" fill="#FF6F91"/>
      <animateTransform attributeName="transform" type="scale" values="1;0.6;1" dur="2.2s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- walking character strolling the whole path -->
  <g>
    <g transform="translate(40,55)">
      <circle cx="0" cy="-10" r="6" fill="#FFDDE6"/>
      <path d="M-6,-11 Q0,-19 6,-11" fill="#B23A62"/>
      <rect x="-4" y="-4" width="8" height="10" rx="3" fill="#FF9EBB"/>
      <line x1="-3" y1="6" x2="-5" y2="13" stroke="#8B2E4F" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="-5;-2;-5" dur="0.4s" repeatCount="indefinite"/>
      </line>
      <line x1="3" y1="6" x2="5" y2="13" stroke="#8B2E4F" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="5;2;5" dur="0.4s" repeatCount="indefinite"/>
      </line>
      <animateTransform attributeName="transform" type="translate" values="40,55; 200,42; 340,50; 480,42; 560,55; 700,48; 860,38; 40,55" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- sparkles trailing -->
  <g fill="#FFD166">
    <path d="M450,25 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M660,20 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
