<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGradSound" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9EBB"/>
      <stop offset="100%" stop-color="#B23A62"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="1" fill="none"/>

  <!-- soundwave bars, center -->
  <g transform="translate(450,60)">
    <g fill="url(#barGradSound)">
      <rect x="-140" y="-6" width="6" height="12" rx="3">
        <animate attributeName="height" values="12;30;8;22;12" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-6;-15;-4;-11;-6" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="-124" y="-10" width="6" height="20" rx="3">
        <animate attributeName="height" values="20;8;28;14;20" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-10;-4;-14;-7;-10" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="-108" y="-16" width="6" height="32" rx="3">
        <animate attributeName="height" values="32;16;36;24;32" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-16;-8;-18;-12;-16" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-92" y="-8" width="6" height="16" rx="3">
        <animate attributeName="height" values="16;28;10;20;16" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-8;-14;-5;-10;-8" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-76" y="-20" width="6" height="40" rx="3">
        <animate attributeName="height" values="40;22;44;30;40" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-20;-11;-22;-15;-20" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="-60" y="-12" width="6" height="24" rx="3">
        <animate attributeName="height" values="24;10;30;18;24" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-12;-5;-15;-9;-12" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-44" y="-24" width="6" height="48" rx="3">
        <animate attributeName="height" values="48;28;52;36;48" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-24;-14;-26;-18;-24" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="-28" y="-14" width="6" height="28" rx="3">
        <animate attributeName="height" values="28;44;18;34;28" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-14;-22;-9;-17;-14" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-12" y="-28" width="6" height="56" rx="3">
        <animate attributeName="height" values="56;34;58;42;56" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-28;-17;-29;-21;-28" dur="2s" repeatCount="indefinite"/>
      </rect>
      <rect x="4" y="-20" width="6" height="40" rx="3">
        <animate attributeName="height" values="40;56;24;46;40" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-20;-28;-12;-23;-20" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="-14" width="6" height="28" rx="3">
        <animate attributeName="height" values="28;42;16;32;28" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-14;-21;-8;-16;-14" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="-24" width="6" height="48" rx="3">
        <animate attributeName="height" values="48;26;52;34;48" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-24;-13;-26;-17;-24" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="52" y="-12" width="6" height="24" rx="3">
        <animate attributeName="height" values="24;38;12;28;24" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-12;-19;-6;-14;-12" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="68" y="-20" width="6" height="40" rx="3">
        <animate attributeName="height" values="40;20;44;28;40" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-20;-10;-22;-14;-20" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="84" y="-8" width="6" height="16" rx="3">
        <animate attributeName="height" values="16;30;8;22;16" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-8;-15;-4;-11;-8" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="100" y="-16" width="6" height="32" rx="3">
        <animate attributeName="height" values="32;18;36;24;32" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-16;-9;-18;-12;-16" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="116" y="-10" width="6" height="20" rx="3">
        <animate attributeName="height" values="20;32;10;24;20" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-10;-16;-5;-12;-10" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="132" y="-6" width="6" height="12" rx="3">
        <animate attributeName="height" values="12;24;6;18;12" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-6;-12;-3;-9;-6" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- floating music notes, drifting up and fading -->
  <g fill="#FF6F91">
    <text x="180" y="80" font-size="20" font-family="sans-serif">♪
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,-50; -20,-100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="720" y="70" font-size="24" font-family="sans-serif">♫
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,-55; 24,-110" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite"/>
    </text>
    <text x="770" y="90" font-size="16" font-family="sans-serif">♪
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-45; -16,-90" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="130" y="55" font-size="16" font-family="sans-serif">♫
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,-40; 20,-80" dur="3.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- caption -->
  <text x="450" y="112" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" fill="#B23A62" font-weight="600">
    🎧 relaxing vibes only — press play on your own playlist ✿
  </text>
</svg>
