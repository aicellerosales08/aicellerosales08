<svg viewBox="0 0 900 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FF9EBB"/>
      <stop offset="50%" stop-color="#FFD1DC"/>
      <stop offset="85%" stop-color="#FF9EBB"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- center line -->
  <rect x="0" y="33" width="900" height="2.5" fill="url(#barGrad)"/>

  <!-- center flower -->
  <g transform="translate(450,34)">
    <g>
      <circle r="5" fill="#fff" cx="-8"/><circle r="5" fill="#fff" cx="8"/>
      <circle r="5" fill="#fff" cy="-8"/><circle r="5" fill="#fff" cy="8"/>
      <circle r="4" fill="#FFD166"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating hearts drifting left to right -->
  <g fill="#FF6F91" opacity="0.9">
    <path d="M100,40 c-2,-4 -8,-2 -8,2 c0,3 8,8 8,8 c0,0 8,-5 8,-8 c0,-4 -6,-6 -8,-2 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; 700,-15; 0,0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- sparkles -->
  <g fill="#FFD166">
    <path d="M200,20 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 200 20; 360 200 20" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M700,50 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 700 50; -360 700 50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M780,15 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 780 15; 360 780 15" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- tiny bouncing mushroom near the edge -->
  <g transform="translate(120,45)">
    <ellipse cx="0" cy="6" rx="8" ry="4" fill="#FFDCE8"/>
    <path d="M-8,0 Q0,-14 8,0 Z" fill="#FF6F91"/>
    <circle cx="-3" cy="-5" r="1.4" fill="#fff"/>
    <circle cx="3" cy="-8" r="1" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="120,45; 120,38; 120,45" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(790,45)">
    <ellipse cx="0" cy="6" rx="7" ry="3.5" fill="#FFDCE8"/>
    <path d="M-7,0 Q0,-12 7,0 Z" fill="#FF9EBB"/>
    <circle cx="-2.5" cy="-4" r="1.2" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="790,45; 790,39; 790,45" dur="1.4s" repeatCount="indefinite"/>
  </g>
</svg>
