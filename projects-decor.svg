<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFD1DC"/>
      <stop offset="80%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="60" width="900" height="2" fill="url(#barGrad6)"/>

  <!-- laptop with blinking code screen, center -->
  <g transform="translate(450,58)">
    <rect x="-24" y="-18" width="48" height="30" rx="3" fill="#8B2E4F"/>
    <rect x="-21" y="-15" width="42" height="24" rx="1" fill="#FFF0F5"/>
    <g font-family="monospace" font-size="7" fill="#B23A62">
      <text x="-17" y="-6">
        &lt;/&gt;
        <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
      </text>
      <text x="-17" y="2">
        {..}
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="-17" y="10">
        ✓ done
        <animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/>
      </text>
    </g>
    <path d="M-27,12 L27,12 L34,20 L-34,20 Z" fill="#FF9EBB"/>
    <animateTransform attributeName="transform" type="translate" values="450,58; 450,52; 450,58" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- rocket launching up from side -->
  <g>
    <g transform="translate(650,80)">
      <ellipse cx="0" cy="0" rx="6" ry="14" fill="#FFF0F5" stroke="#B23A62" stroke-width="1.3"/>
      <polygon points="-6,-9 6,-9 0,-19" fill="#FF6F91"/>
      <polygon points="-6,7 -11,14 -6,12" fill="#FF9EBB"/>
      <polygon points="6,7 11,14 6,12" fill="#FF9EBB"/>
      <circle cx="0" cy="-1" r="3" fill="#8E75FF"/>
      <path d="M-2.5,12 Q0,22 2.5,12" fill="#FFD166">
        <animate attributeName="d" values="M-2.5,12 Q0,22 2.5,12; M-2.5,12 Q0,30 2.5,12; M-2.5,12 Q0,22 2.5,12" dur="0.35s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="650,90; 650,20; 650,90" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- floating figma-like shape + phone icon -->
  <g transform="translate(230,50)">
    <circle cx="0" cy="0" r="6" fill="#FF9EBB"/>
    <path d="M6,0 a6,6 0 1,1 -6,-6 a6,6 0 0,1 6,6" fill="#8E75FF" opacity="0.85"/>
    <animateTransform attributeName="transform" type="translate" values="230,50; 230,38; 230,50" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(750,45)">
    <rect x="-6" y="-11" width="12" height="22" rx="3" fill="#B5E6C9" stroke="#5A8F6E" stroke-width="1"/>
    <circle cx="0" cy="7" r="1.3" fill="#5A8F6E"/>
    <animateTransform attributeName="transform" type="translate" values="750,45; 750,36; 750,45" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFD166">
    <path d="M150,30 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M810,75 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
    </path>
    <path d="M550,20 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- little mushroom cheering at the edge -->
  <g transform="translate(100,80)">
    <ellipse cx="0" cy="6" rx="8" ry="4" fill="#FFDCE8"/>
    <path d="M-8,0 Q0,-14 8,0 Z" fill="#FF6F91"/>
    <circle cx="-3" cy="-5" r="1.4" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="100,80; 100,73; 100,80" dur="1.1s" repeatCount="indefinite"/>
  </g>
</svg>
