<svg viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9EBB" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FFD1DC"/>
      <stop offset="80%" stop-color="#FFD1DC"/>
      <stop offset="100%" stop-color="#FF9EBB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="44" width="900" height="2" fill="url(#barGrad2)"/>

  <!-- center badge / medal bouncing -->
  <g transform="translate(450,45)">
    <g>
      <circle r="18" fill="#FFD166" stroke="#B23A62" stroke-width="2"/>
      <path d="M-10,-2 L-4,4 L10,-8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-9,10 L-16,26 L-4,20 L2,30 L9,12" fill="#FF6F91" opacity="0.9"/>
      <animateTransform attributeName="transform" type="translate" values="450,45; 450,35; 450,45" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- confetti falling around badge -->
  <g>
    <rect x="330" y="10" width="6" height="6" fill="#FF9EBB">
      <animateTransform attributeName="transform" type="translate" values="0,0; 10,60; 0,0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 333 13; 360 333 13" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="380" cy="15" r="3.5" fill="#FFD166">
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,55; 0,0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="540" y="12" width="5" height="5" fill="#B5E6C9">
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,58; 0,0" dur="3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 542 14; -360 542 14" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="580" cy="8" r="3" fill="#FF6F91">
      <animateTransform attributeName="transform" type="translate" values="0,0; 12,62; 0,0" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small stars scattered, twinkling -->
  <g fill="#FFD166">
    <path d="M150,40 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M750,50 l1.5,4 4,1 -3,2.5 1,4 -3.5,-2.5 -3.5,2.5 1,-4 -3,-2.5 4,-1 Z">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M220,60 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M700,20 l1,3 3,0.8 -2.3,1.9 0.7,3 -2.7,-1.9 -2.7,1.9 0.7,-3 -2.3,-1.9 3,-0.8 Z">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- small flying butterfly -->
  <g>
    <g transform="translate(120,50)">
      <ellipse cx="-5" cy="0" rx="6" ry="4" fill="#FF9EBB" transform="rotate(-20 -5 0)">
        <animate attributeName="rx" values="6;2;6" dur="0.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="5" cy="0" rx="6" ry="4" fill="#FF9EBB" transform="rotate(20 5 0)">
        <animate attributeName="rx" values="6;2;6" dur="0.4s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#B23A62" stroke-width="1.5"/>
      <animateTransform attributeName="transform" type="translate" values="120,50; 220,25; 340,55; 220,25; 120,50" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <g transform="translate(780,35)">
      <ellipse cx="-5" cy="0" rx="5" ry="3.5" fill="#B5E6C9" transform="rotate(-20 -5 0)">
        <animate attributeName="rx" values="5;1.5;5" dur="0.35s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="5" cy="0" rx="5" ry="3.5" fill="#B5E6C9" transform="rotate(20 5 0)">
        <animate attributeName="rx" values="5;1.5;5" dur="0.35s" repeatCount="indefinite"/>
      </ellipse>
      <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#5A8F6E" stroke-width="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="780,35; 680,60; 560,30; 680,60; 780,35" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
